services:
  bot:
    image: ${BOT_IMAGE}
    restart: on-failure
    volumes:
      - ./.env:/app/.env
    depends_on:
      - pg

  pg:
    image: postgres:16.0-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT_EXTERNAL}:5432'

volumes:
  postgres_data:

networks:
  default:
